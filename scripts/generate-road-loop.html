<!doctype html>
<meta charset="utf-8">
<title>Generating road loop</title>
<canvas id="canvas" width="1280" height="480"></canvas>
<script>
  const canvas = document.querySelector('#canvas');
  const ctx = canvas.getContext('2d');
  const image = new Image();
  image.src = '/public/assets/illustrated-90s-odia-night-cockpit-v19.png';

  image.onload = async () => {
    const fps = 30;
    const seconds = 8;
    const total = fps * seconds;
    const stream = canvas.captureStream(fps);
    const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 4200000 });
    const chunks = [];
    recorder.ondataavailable = event => event.data.size && chunks.push(event.data);
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'odia-night-road-loop.webm';
      document.body.appendChild(link);
      link.click();
      document.title = 'ROAD_LOOP_COMPLETE';
    };
    recorder.start();

    let frame = 0;
    const draw = () => {
      const phase = frame / total;
      const pulse = (1 - Math.cos(phase * Math.PI * 2)) / 2;
      const zoom = 1 + pulse * 0.035;
      const sourceWidth = 1120 / zoom;
      const sourceHeight = 420 / zoom;
      const sourceX = 276 + (1120 - sourceWidth) / 2;
      const sourceY = 142 + (420 - sourceHeight) / 2;
      ctx.drawImage(image, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, canvas.width, canvas.height);

      const glow = ctx.createRadialGradient(640, 455, 20, 640, 455, 390);
      glow.addColorStop(0, `rgba(255,225,170,${0.18 + pulse * 0.08})`);
      glow.addColorStop(1, 'rgba(255,190,100,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.strokeStyle = 'rgba(205,225,235,.22)';
      ctx.lineWidth = 1.2;
      for (let i = 0; i < 68; i++) {
        const seed = (i * 97) % 1280;
        const y = ((i * 53 + frame * 17) % 620) - 80;
        const x = (seed + frame * 3) % 1340 - 30;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - 10, y + 32);
        ctx.stroke();
      }
      ctx.restore();

      if (phase > .31 && phase < .39) {
        const x = ((phase - .31) / .08) * 1600 - 160;
        const beam = ctx.createLinearGradient(x - 140, 0, x + 140, 0);
        beam.addColorStop(0, 'rgba(255,230,185,0)');
        beam.addColorStop(.5, 'rgba(255,230,185,.16)');
        beam.addColorStop(1, 'rgba(255,230,185,0)');
        ctx.fillStyle = beam;
        ctx.fillRect(x - 140, 0, 280, 480);
      }

      frame += 1;
      if (frame <= total) setTimeout(draw, 1000 / fps);
      else recorder.stop();
    };
    draw();
  };
</script>
